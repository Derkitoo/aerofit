<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mainBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A00E0"/>
      <stop offset="45%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#FD79A8"/>
    </linearGradient>

    <!-- Glass Overlay Gradient -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Pulse Line Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FF7675"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Radial Background Glow -->
    <radialGradient id="centerLight" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#A29BFE" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6C5CE7" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow Effects -->
    <filter id="shadowDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#2D3436" flood-opacity="0.4"/>
    </filter>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FD79A8" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#6C5CE7" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Main Squircle Card -->
  <rect width="512" height="512" rx="116" fill="url(#mainBgGrad)"/>

  <!-- Radial Depth Light -->
  <circle cx="256" cy="190" r="220" fill="url(#centerLight)"/>

  <!-- Glass Border Highlight -->
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="url(#glassSheen)" stroke-width="4"/>

  <!-- Central Fitness Pulse Emblem Group -->
  <g filter="url(#shadowDepth)">
    
    <!-- Stylized Dumbbell Silhouette Backdrop -->
    <!-- Left Weight Plate -->
    <rect x="110" y="216" width="24" height="80" rx="12" fill="#FFFFFF" opacity="0.25"/>
    <rect x="124" y="200" width="20" height="112" rx="10" fill="#FFFFFF" opacity="0.35"/>
    
    <!-- Right Weight Plate -->
    <rect x="368" y="216" width="24" height="80" rx="12" fill="#FFFFFF" opacity="0.25"/>
    <rect x="368" y="200" width="20" height="112" rx="10" fill="#FFFFFF" opacity="0.35"/>

    <!-- Dumbbell Bar -->
    <rect x="140" y="244" width="232" height="24" rx="12" fill="#FFFFFF" opacity="0.4"/>

    <!-- Glowing Heartbeat / Dynamic Pulse Line -->
    <path d="M 96,256 
             H 170 
             L 205,152 
             L 256,360 
             L 307,192 
             L 342,256 
             H 416" 
          fill="none" 
          stroke="url(#pulseGrad)" 
          stroke-width="22" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#neonGlow)"/>

    <!-- Sparkle / Pulse Points -->
    <circle cx="205" cy="152" r="10" fill="#FFFFFF" filter="url(#neonGlow)"/>
    <circle cx="256" cy="360" r="12" fill="#FF7675" filter="url(#neonGlow)"/>
    <circle cx="307" cy="192" r="10" fill="#FFFFFF" filter="url(#neonGlow)"/>
    <circle cx="96" cy="256" r="8" fill="#FFFFFF"/>
    <circle cx="416" cy="256" r="8" fill="#FFFFFF"/>

  </g>

  <!-- Glass Sheen Overlay Top Half -->
  <path d="M 0,116 
           C 0,51.9 51.9,0 116,0 
           H 396 
           C 460.1,0 512,51.9 512,116 
           V 220 
           C 320,180 180,260 0,190 
           Z" 
        fill="url(#glassSheen)"/>
</svg>
